<meta charset="utf-8">
<title>Pipeline architecture — Urban Heat Island Mitigation</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper:  #0B1120;
    --ink:    #F1F5F9;
    --muted:  #94A3B8;
    --soft:   #64748B;
    --accent: #FBBF24;
  }
  html, body { margin: 0; padding: 0; background: var(--paper); }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  svg { display: block; width: 1440px; height: 560px; }
</style>

<!-- Architecture diagram, diagram-design system, skinned to the dashboard palette
     (frontend/style.css tokens). Fira Sans / Fira Code stand in for Geist so the
     diagram matches the deck and the dashboard it describes.

     The canvas is 1440x560 (~2.6:1) to fit the deck's content area under the
     slide heading without letterboxing. -->
<svg viewBox="0 0 1440 560" role="img" aria-labelledby="uhi-arch-title uhi-arch-desc"
     xmlns="http://www.w3.org/2000/svg">
  <title id="uhi-arch-title">Urban Heat Island pipeline architecture</title>
  <desc id="uhi-arch-desc">Remote sensing feeds two branches: a machine-learning branch that ends in a metrics report nothing downstream consumes, and a decision-support branch whose ranked, costed output drives the dashboard. Decision support, not the model, produces the recommendation.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FBBF24"/>
    </marker>
    <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1440" height="560" fill="#0B1120"/>

  <!-- ============ arrows first (z-order: lines behind boxes) ============ -->

  <!-- Remote Sensing -> Machine Learning. The two exits are fanned 48px apart so
       neither connector hides the other. -->
  <path d="M 248,256 H 536 Q 544,256 544,248 V 168" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="356" y="236" width="72" height="14" rx="2" fill="#0B1120"/>
  <text x="392" y="247" fill="#64748B" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.08em">FEATURES</text>

  <!-- Remote Sensing -> Decision Support -->
  <path d="M 248,304 H 536 Q 544,304 544,312 V 344" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="348" y="284" width="88" height="14" rx="2" fill="#0B1120"/>
  <text x="392" y="295" fill="#64748B" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.08em">GRID + LAND</text>

  <!-- Machine Learning -> metrics.json (dashed: reported, not consumed) -->
  <path d="M 648,116 H 792" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
  <rect x="688" y="96" width="64" height="14" rx="2" fill="#0B1120"/>
  <text x="720" y="107" fill="#64748B" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.08em">SCORES</text>

  <!-- Decision Support -> Dashboard (accent: the load-bearing hand-off) -->
  <path d="M 648,396 H 792" fill="none" stroke="#FBBF24" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="684" y="376" width="72" height="14" rx="2" fill="#0B1120"/>
  <text x="720" y="387" fill="#FBBF24" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.08em">RANKING</text>

  <!-- dead-end stub after metrics.json -->
  <path d="M 1000,116 H 1060" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1064" y1="100" x2="1064" y2="132" stroke="#64748B" stroke-width="1.6"/>

  <!-- ============ nodes ============ -->

  <!-- Remote Sensing -->
  <rect x="40" y="228" width="208" height="104" rx="8" fill="#0B1120"/>
  <rect x="40" y="228" width="208" height="104" rx="8" fill="#131C2E" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="52" y="240" width="44" height="16" rx="2" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>
  <text x="74" y="251" fill="#94A3B8" font-size="9" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.10em">DATA</text>
  <text x="144" y="288" fill="#F1F5F9" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Remote Sensing</text>
  <text x="144" y="312" fill="#94A3B8" font-size="11" font-family="'Fira Code', monospace" text-anchor="middle">Earth Engine · QGIS</text>

  <!-- Machine Learning -->
  <rect x="440" y="64" width="208" height="104" rx="8" fill="#0B1120"/>
  <rect x="440" y="64" width="208" height="104" rx="8" fill="#131C2E" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="452" y="76" width="52" height="16" rx="2" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>
  <text x="478" y="87" fill="#94A3B8" font-size="9" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.10em">MODEL</text>
  <text x="544" y="124" fill="#F1F5F9" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Machine Learning</text>
  <text x="544" y="148" fill="#94A3B8" font-size="11" font-family="'Fira Code', monospace" text-anchor="middle">RandomForest</text>

  <!-- metrics.json (terminates) -->
  <rect x="792" y="64" width="208" height="104" rx="8" fill="#0B1120"/>
  <rect x="792" y="64" width="208" height="104" rx="8" fill="rgba(241,245,249,0.02)" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="804" y="76" width="56" height="16" rx="2" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.8"/>
  <text x="832" y="87" fill="#64748B" font-size="9" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.10em">REPORT</text>
  <text x="896" y="124" fill="#94A3B8" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">metrics.json</text>
  <text x="896" y="148" fill="#64748B" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle">R² 0.90 random · 0.51 blocked</text>

  <!-- Decision Support — FOCAL -->
  <rect x="440" y="344" width="208" height="104" rx="8" fill="#0B1120"/>
  <rect x="440" y="344" width="208" height="104" rx="8" fill="rgba(251,191,36,0.10)" stroke="#FBBF24" stroke-width="1.2"/>
  <rect x="452" y="356" width="48" height="16" rx="2" fill="none" stroke="rgba(251,191,36,0.45)" stroke-width="0.8"/>
  <text x="476" y="367" fill="#FBBF24" font-size="9" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.10em">RULES</text>
  <text x="544" y="404" fill="#F1F5F9" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Decision Support</text>
  <text x="544" y="428" fill="#94A3B8" font-size="11" font-family="'Fira Code', monospace" text-anchor="middle">land-cover gate · cost</text>

  <!-- Dashboard -->
  <rect x="792" y="344" width="208" height="104" rx="8" fill="#0B1120"/>
  <rect x="792" y="344" width="208" height="104" rx="8" fill="#131C2E" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="804" y="356" width="32" height="16" rx="2" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>
  <text x="820" y="367" fill="#94A3B8" font-size="9" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.10em">UI</text>
  <text x="896" y="404" fill="#F1F5F9" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Dashboard</text>
  <text x="896" y="428" fill="#94A3B8" font-size="11" font-family="'Fira Code', monospace" text-anchor="middle">Leaflet · heat field</text>

  <!-- ============ editorial annotation ============ -->
  <text x="1088" y="108" fill="#94A3B8" font-size="15" font-style="italic" font-family="Georgia, 'Times New Roman', serif">nothing downstream</text>
  <text x="1088" y="132" fill="#94A3B8" font-size="15" font-style="italic" font-family="Georgia, 'Times New Roman', serif">reads this file</text>

  <!-- ============ legend strip ============ -->
  <line x1="40" y1="492" x2="1400" y2="492" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
  <text x="40" y="520" fill="#64748B" font-size="10" font-family="'Fira Code', monospace" letter-spacing="0.14em">LEGEND</text>

  <line x1="132" y1="516" x2="172" y2="516" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="184" y="520" fill="#94A3B8" font-size="11" font-family="'Fira Sans', sans-serif">Data the plan depends on</text>

  <line x1="400" y1="516" x2="440" y2="516" stroke="#64748B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
  <text x="452" y="520" fill="#94A3B8" font-size="11" font-family="'Fira Sans', sans-serif">Reported, but not consumed</text>

  <rect x="732" y="508" width="16" height="16" rx="3" fill="rgba(251,191,36,0.10)" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="760" y="520" fill="#94A3B8" font-size="11" font-family="'Fira Sans', sans-serif">Where the recommendation is actually made</text>
</svg>
