<meta charset="utf-8">
<title>Processing pipeline — Urban Heat Island Mitigation</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #FFFFFF; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  svg { display: block; width: 1200px; height: 940px; }
</style>

<!-- Vertical layered pipeline, following the content reference's diagram form:
     numbered stages top to bottom, a tinted container where a stage holds two
     sub-stages, and a feedback edge closing the loop. Tints are the layout
     reference's own (EDEAE2 warm grey, F8E7DE blush, E1EFEB pale teal) so the
     diagram and the deck share one palette. -->
<svg viewBox="0 0 1200 940" role="img" aria-labelledby="pipe-t pipe-d"
     xmlns="http://www.w3.org/2000/svg">
  <title id="pipe-t">Urban heat mitigation processing pipeline</title>
  <desc id="pipe-d">Six layers top to bottom: data acquisition; preprocessing and feature extraction onto a 100 metre grid; a suitability and cost layer containing the land-cover eligibility gate and the unit cost model; ranking and budget optimisation; validation and reproducibility; and the decision interface. A scheduled Earth Engine refresh feeds back into preprocessing.</desc>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 9 3.5, 0 7" fill="#8A9096"/>
    </marker>
    <marker id="ar-fb" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9AA0A6"/>
    </marker>
  </defs>

  <rect width="1200" height="940" fill="#FFFFFF"/>

  <!-- ============ connectors (behind the boxes) ============ -->
  <g fill="none" stroke="#8A9096" stroke-width="1.6" marker-end="url(#ar)">
    <path d="M 520,126 V 168"/>
    <path d="M 520,264 V 306"/>
    <path d="M 520,542 V 584"/>
    <path d="M 520,680 V 722"/>
    <path d="M 520,818 V 860"/>
  </g>

  <!-- feedback: the scheduled refresh re-enters at preprocessing -->
  <path d="M 950,898 H 1046 Q 1112,898 1112,832 V 264 Q 1112,198 1046,198 H 950"
        fill="none" stroke="#9AA0A6" stroke-width="1.4" marker-end="url(#ar-fb)"/>
  <text x="1128" y="536" fill="#5C6369" font-size="15" font-family="Inter, sans-serif"
        text-anchor="middle" transform="rotate(90 1128 536)">↻ monthly Earth Engine refresh</text>

  <!-- ============ 1 — acquisition ============ -->
  <rect x="90" y="40" width="860" height="86" rx="12" fill="#EDEAE2" stroke="#D3D0C8" stroke-width="1.4"/>
  <text x="520" y="76" fill="#3A4046" font-size="21" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle">1. Data acquisition</text>
  <text x="520" y="104" fill="#5C6369" font-size="16" font-family="Inter, sans-serif" text-anchor="middle">Landsat 8 Collection 2 L2 · ESA WorldCover 10 m · municipal rate schedules</text>

  <!-- ============ 2 — preprocessing ============ -->
  <rect x="90" y="178" width="860" height="86" rx="12" fill="#F8E7DE" stroke="#DE5C2D" stroke-width="1.4"/>
  <text x="520" y="214" fill="#B2481F" font-size="21" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle">2. Preprocessing and feature extraction</text>
  <text x="520" y="242" fill="#8A5540" font-size="16" font-family="Inter, sans-serif" text-anchor="middle">Cloud mask · median composite · LST, NDVI, NDBI · 100 m grid of 8,144 cells</text>

  <!-- ============ 3 — suitability and cost (container) ============ -->
  <rect x="90" y="316" width="860" height="226" rx="14" fill="#E1EFEB" stroke="#26776F" stroke-width="1.4"/>
  <text x="120" y="352" fill="#1D5F58" font-size="21" font-weight="700" font-family="Inter, sans-serif">3. Suitability and cost layer</text>
  <text x="120" y="378" fill="#3F7A73" font-size="15" font-family="Inter, sans-serif">Rules applied before any ranking occurs</text>

  <rect x="118" y="398" width="392" height="120" rx="10" fill="#E8F1E4" stroke="#4E8C4A" stroke-width="1.3"/>
  <text x="314" y="434" fill="#33702F" font-size="18" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle">Land-cover eligibility gate</text>
  <text x="314" y="460" fill="#4A7A46" font-size="15" font-family="Inter, sans-serif" text-anchor="middle">Water, wetland and existing</text>
  <text x="314" y="482" fill="#4A7A46" font-size="15" font-family="Inter, sans-serif" text-anchor="middle">canopy removed</text>
  <text x="314" y="506" fill="#33702F" font-size="15" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle">8,144 → 4,157 cells</text>

  <rect x="530" y="398" width="392" height="120" rx="10" fill="#FBEFDD" stroke="#B07A2E" stroke-width="1.3"/>
  <text x="726" y="434" fill="#8A5D1C" font-size="18" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle">Unit cost model</text>
  <text x="726" y="460" fill="#8A6A3C" font-size="15" font-family="Inter, sans-serif" text-anchor="middle">rate × coverage fraction</text>
  <text x="726" y="482" fill="#8A6A3C" font-size="15" font-family="Inter, sans-serif" text-anchor="middle">× cell area</text>
  <text x="726" y="506" fill="#8A5D1C" font-size="15" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle">₹167.5 Cr upper bound</text>

  <path d="M 514,458 H 526" fill="none" stroke="#8A9096" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ============ 4 — ranking ============ -->
  <rect x="90" y="594" width="860" height="86" rx="12" fill="#E4EDF5" stroke="#376491" stroke-width="1.4"/>
  <text x="520" y="630" fill="#2C5279" font-size="21" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle">4. Ranking and budget optimisation</text>
  <text x="520" y="658" fill="#4A6C8C" font-size="16" font-family="Inter, sans-serif" text-anchor="middle">ΔT / cost desc, then LST desc · greedy fill to the budget ceiling · 4,157 → 249</text>

  <!-- ============ 5 — validation ============ -->
  <rect x="90" y="732" width="860" height="86" rx="12" fill="#FBEAE3" stroke="#B23A2A" stroke-width="1.4"/>
  <text x="520" y="768" fill="#96301F" font-size="21" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle">5. Validation and reproducibility</text>
  <text x="520" y="796" fill="#8A5147" font-size="16" font-family="Inter, sans-serif" text-anchor="middle">135 tests · CI regenerates every artefact and fails on divergence</text>

  <!-- ============ 6 — interface ============ -->
  <rect x="90" y="870" width="860" height="56" rx="12" fill="#EDEAE2" stroke="#D3D0C8" stroke-width="1.4"/>
  <text x="520" y="895" fill="#3A4046" font-size="21" font-weight="700" font-family="Inter, sans-serif" text-anchor="middle">6. Decision interface</text>
  <text x="520" y="916" fill="#5C6369" font-size="15" font-family="Inter, sans-serif" text-anchor="middle">grid.geojson · ranking.csv · dashboard with client-side re-ranking</text>
</svg>
