<meta charset="utf-8">
<title>Processing pipeline — Urban Heat Island Mitigation</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0C1017; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  svg { display: block; width: 1600px; height: 620px; }
</style>

<!-- Processing pipeline, diagram-design system, skinned to the dashboard palette
     (frontend/style.css). Every stage names the artefact it produces, so the
     diagram doubles as the data-flow reference rather than a decorative chain. -->
<svg viewBox="0 0 1600 620" role="img" aria-labelledby="pipe-title pipe-desc"
     xmlns="http://www.w3.org/2000/svg">
  <title id="pipe-title">Urban heat mitigation processing pipeline</title>
  <desc id="pipe-desc">Eight stages in four phases: acquisition composites Landsat 8 and masks cloud; derivation computes land surface temperature, NDVI and NDBI onto a 100 metre grid of 8,144 cells; decision gates cells on ESA WorldCover land cover, prices each measure, ranks by cooling per rupee with temperature as tie-break and caps at budget; delivery emits the ranked CSV and the dashboard.</desc>

  <defs>
    <marker id="a" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#9AA6BC"/>
    </marker>
    <marker id="a-acc" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#E0A23C"/>
    </marker>
    <marker id="a-dim" markerWidth="7" markerHeight="5" refX="6" refY="2.5" orient="auto">
      <polygon points="0 0, 7 2.5, 0 5" fill="#6B7891"/>
    </marker>
  </defs>

  <rect width="1600" height="620" fill="#0C1017"/>

  <!-- ============ phase zones (drawn first) ============ -->
  <g fill="rgba(232,234,240,0.018)" stroke="rgba(232,234,240,0.09)" stroke-width="0.8">
    <rect x="40"   y="170" width="352" height="184" rx="6"/>
    <rect x="412"  y="170" width="352" height="184" rx="6"/>
    <rect x="784"  y="170" width="536" height="184" rx="6"/>
    <rect x="1340" y="170" width="220" height="184" rx="6"/>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-size="10" letter-spacing="0.14em" fill="#6B7891">
    <rect x="52" y="163" width="94" height="13" fill="#0C1017"/><text x="56" y="173">ACQUISITION</text>
    <rect x="424" y="163" width="80" height="13" fill="#0C1017"/><text x="428" y="173">DERIVATION</text>
    <rect x="796" y="163" width="66" height="13" fill="#0C1017"/><text x="800" y="173">DECISION</text>
    <rect x="1352" y="163" width="62" height="13" fill="#0C1017"/><text x="1356" y="173">DELIVERY</text>
  </g>

  <!-- ============ connectors ============ -->
  <g fill="none" stroke="#9AA6BC" stroke-width="1.2" marker-end="url(#a)">
    <path d="M 212,262 H 224"/>
    <path d="M 384,262 H 424"/>
    <path d="M 584,262 H 596"/>
    <path d="M 756,262 H 796"/>
    <path d="M 956,262 H 968"/>
    <path d="M 1128,262 H 1140"/>
  </g>
  <path d="M 1300,262 H 1352" fill="none" stroke="#E0A23C" stroke-width="1.4" marker-end="url(#a-acc)"/>

  <!-- side input: WorldCover into the eligibility gate -->
  <path d="M 878,404 V 326" fill="none" stroke="#6B7891" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-dim)"/>

  <!-- ============ stage boxes ============ -->
  <g>
    <!-- A -->
    <rect x="56" y="218" width="156" height="88" rx="5" fill="#11161F" stroke="rgba(232,234,240,0.16)"/>
    <text x="134" y="248" fill="#E8EAF0" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Landsat 8</text>
    <text x="134" y="268" fill="#9AA6BC" font-size="10.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Collection 2 L2</text>
    <text x="134" y="286" fill="#6B7891" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">thermal + optical</text>

    <!-- B -->
    <rect x="228" y="218" width="156" height="88" rx="5" fill="#11161F" stroke="rgba(232,234,240,0.16)"/>
    <text x="306" y="248" fill="#E8EAF0" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Cloud mask</text>
    <text x="306" y="268" fill="#9AA6BC" font-size="10.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">QA_PIXEL + composite</text>
    <text x="306" y="286" fill="#6B7891" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Earth Engine</text>

    <!-- C -->
    <rect x="428" y="218" width="156" height="88" rx="5" fill="#11161F" stroke="rgba(232,234,240,0.16)"/>
    <text x="506" y="248" fill="#E8EAF0" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">LST · NDVI · NDBI</text>
    <text x="506" y="268" fill="#9AA6BC" font-size="10.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">per-pixel indices</text>
    <text x="506" y="286" fill="#6B7891" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">21.1 – 33.2 °C</text>

    <!-- D -->
    <rect x="600" y="218" width="156" height="88" rx="5" fill="#11161F" stroke="rgba(232,234,240,0.16)"/>
    <text x="678" y="248" fill="#E8EAF0" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">100 m grid</text>
    <text x="678" y="268" fill="#9AA6BC" font-size="10.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">QGIS fishnet</text>
    <text x="678" y="286" fill="#6B7891" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">8,144 cells</text>

    <!-- E — eligibility -->
    <rect x="800" y="218" width="156" height="88" rx="5" fill="rgba(94,158,126,0.10)" stroke="#5E9E7E"/>
    <text x="878" y="248" fill="#E8EAF0" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Eligibility gate</text>
    <text x="878" y="268" fill="#9AA6BC" font-size="10.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">never-touch classes</text>
    <text x="878" y="286" fill="#5E9E7E" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">8,144 → 4,157</text>

    <!-- F — cost -->
    <rect x="972" y="218" width="156" height="88" rx="5" fill="#11161F" stroke="rgba(232,234,240,0.16)"/>
    <text x="1050" y="248" fill="#E8EAF0" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Cost model</text>
    <text x="1050" y="268" fill="#9AA6BC" font-size="10.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">rate × coverage × area</text>
    <text x="1050" y="286" fill="#6B7891" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">₹167.5 Cr upper bound</text>

    <!-- G — ranking, focal -->
    <rect x="1144" y="218" width="156" height="88" rx="5" fill="rgba(224,162,60,0.10)" stroke="#E0A23C" stroke-width="1.2"/>
    <text x="1222" y="248" fill="#E8EAF0" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Rank + budget cap</text>
    <text x="1222" y="268" fill="#9AA6BC" font-size="10.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">greedy, cooling per ₹</text>
    <text x="1222" y="286" fill="#E0A23C" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">4,157 → 249 funded</text>

    <!-- H -->
    <rect x="1356" y="218" width="188" height="88" rx="5" fill="#11161F" stroke="rgba(232,234,240,0.16)"/>
    <text x="1450" y="248" fill="#E8EAF0" font-size="14" font-weight="600" font-family="Inter, sans-serif" text-anchor="middle">Dashboard + CSV</text>
    <text x="1450" y="268" fill="#9AA6BC" font-size="10.5" font-family="'IBM Plex Mono', monospace" text-anchor="middle">grid.geojson · ranking.csv</text>
    <text x="1450" y="286" fill="#6B7891" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">Leaflet, re-runs client-side</text>

    <!-- side input -->
    <rect x="790" y="404" width="176" height="52" rx="5" fill="#11161F" stroke="rgba(232,234,240,0.12)" stroke-dasharray="4,3"/>
    <text x="878" y="426" fill="#9AA6BC" font-size="12.5" font-weight="500" font-family="Inter, sans-serif" text-anchor="middle">ESA WorldCover 10 m</text>
    <text x="878" y="444" fill="#6B7891" font-size="10" font-family="'IBM Plex Mono', monospace" text-anchor="middle">water · wetland · tree cover</text>
  </g>

  <!-- ============ the ranking rule, stated ============ -->
  <rect x="1000" y="404" width="544" height="76" rx="5" fill="rgba(224,162,60,0.06)" stroke="rgba(224,162,60,0.28)"/>
  <text x="1020" y="426" fill="#E0A23C" font-size="10" letter-spacing="0.12em" font-family="'IBM Plex Mono', monospace">SELECTION RULE</text>
  <text x="1020" y="448" fill="#E8EAF0" font-size="13" font-family="'IBM Plex Mono', monospace">sort by  ΔT / cost  desc,  then LST desc,  then grid_id</text>
  <text x="1020" y="468" fill="#9AA6BC" font-size="11" font-family="Inter, sans-serif">fill greedily while cumulative cost ≤ budget</text>

  <!-- ============ legend ============ -->
  <line x1="40" y1="530" x2="1560" y2="530" stroke="rgba(232,234,240,0.08)" stroke-width="0.8"/>
  <text x="40" y="558" fill="#6B7891" font-size="10" letter-spacing="0.14em" font-family="'IBM Plex Mono', monospace">LEGEND</text>

  <rect x="132" y="547" width="12" height="12" rx="2" fill="rgba(94,158,126,0.10)" stroke="#5E9E7E"/>
  <text x="154" y="558" fill="#9AA6BC" font-size="11.5" font-family="Inter, sans-serif">Safety gate — rules that remove cells</text>

  <rect x="452" y="547" width="12" height="12" rx="2" fill="rgba(224,162,60,0.10)" stroke="#E0A23C"/>
  <text x="474" y="558" fill="#9AA6BC" font-size="11.5" font-family="Inter, sans-serif">Selection — where the shortlist is decided</text>

  <line x1="800" y1="553" x2="836" y2="553" stroke="#6B7891" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#a-dim)"/>
  <text x="848" y="558" fill="#9AA6BC" font-size="11.5" font-family="Inter, sans-serif">Reference dataset, not a processing stage</text>
</svg>
