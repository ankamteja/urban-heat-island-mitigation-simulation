<meta charset="utf-8">
<title>Pipeline architecture — Urban Heat Island Mitigation</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Fira+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0B1120; }
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; }
  svg { display: block; width: 1440px; height: 580px; }
</style>

<!-- Architecture diagram, diagram-design system, skinned to the dashboard palette
     (frontend/style.css tokens). Fira Sans / Fira Code stand in for Geist so the
     diagram matches the deck and the dashboard it describes.

     Each node carries three lines: what it is, what it runs on, and the number a
     judge would otherwise have to ask for. The arrows carry the funnel —
     8,144 cells in, 4,157 eligible, 249 funded — so the drop-off is legible
     without a second chart. Canvas is ~2.5:1 to fit the deck's content area. -->
<svg viewBox="0 0 1440 580" role="img" aria-labelledby="uhi-arch-title uhi-arch-desc"
     xmlns="http://www.w3.org/2000/svg">
  <title id="uhi-arch-title">Urban Heat Island pipeline architecture</title>
  <desc id="uhi-arch-desc">Remote sensing feeds two branches: a machine-learning branch that ends in a metrics report used only as a diagnostic, and a decision-support branch whose land-cover gate narrows 8,144 cells to 4,157 eligible and 249 funded, driving the dashboard. Decision support, not the model, produces the recommendation.</desc>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#FBBF24"/>
    </marker>
    <marker id="arrow-soft" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748B"/>
    </marker>
  </defs>

  <rect width="1440" height="580" fill="#0B1120"/>

  <!-- ============ arrows first (z-order: lines behind boxes) ============ -->

  <!-- Remote Sensing -> Machine Learning. Exits are fanned 48 px apart so neither
       connector hides the other. -->
  <path d="M 264,268 H 552 Q 560,268 560,260 V 176" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="360" y="248" width="96" height="14" rx="2" fill="#0B1120"/>
  <text x="408" y="259" fill="#64748B" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.08em">5 FEATURES</text>

  <!-- Remote Sensing -> Decision Support -->
  <path d="M 264,316 H 552 Q 560,316 560,324 V 368" fill="none" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="356" y="296" width="104" height="14" rx="2" fill="#0B1120"/>
  <text x="408" y="307" fill="#94A3B8" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.08em">8,144 CELLS</text>

  <!-- Machine Learning -> metrics.json (dashed: diagnostic, not consumed) -->
  <path d="M 672,116 H 816" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
  <rect x="712" y="96" width="64" height="14" rx="2" fill="#0B1120"/>
  <text x="744" y="107" fill="#64748B" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.08em">SCORES</text>

  <!-- Decision Support -> Dashboard (accent: the load-bearing hand-off) -->
  <path d="M 672,428 H 816" fill="none" stroke="#FBBF24" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
  <rect x="696" y="408" width="96" height="14" rx="2" fill="#0B1120"/>
  <text x="744" y="419" fill="#FBBF24" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.08em">249 FUNDED</text>

  <!-- dead-end stub after metrics.json -->
  <path d="M 1040,116 H 1100" fill="none" stroke="#64748B" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="1104" y1="100" x2="1104" y2="132" stroke="#64748B" stroke-width="1.6"/>

  <!-- ============ nodes ============ -->

  <!-- Remote Sensing -->
  <rect x="40" y="232" width="224" height="120" rx="8" fill="#0B1120"/>
  <rect x="40" y="232" width="224" height="120" rx="8" fill="#131C2E" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="52" y="244" width="44" height="16" rx="2" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>
  <text x="74" y="255" fill="#94A3B8" font-size="9" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.10em">DATA</text>
  <text x="152" y="288" fill="#F1F5F9" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Remote Sensing</text>
  <text x="152" y="310" fill="#94A3B8" font-size="11" font-family="'Fira Code', monospace" text-anchor="middle">Landsat 8 · ESA WorldCover</text>
  <text x="152" y="330" fill="#64748B" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle">Earth Engine · QGIS · 100 m</text>

  <!-- Machine Learning -->
  <rect x="448" y="56" width="224" height="120" rx="8" fill="#0B1120"/>
  <rect x="448" y="56" width="224" height="120" rx="8" fill="#131C2E" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="460" y="68" width="52" height="16" rx="2" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>
  <text x="486" y="79" fill="#94A3B8" font-size="9" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.10em">MODEL</text>
  <text x="560" y="112" fill="#F1F5F9" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Machine Learning</text>
  <text x="560" y="134" fill="#94A3B8" font-size="11" font-family="'Fira Code', monospace" text-anchor="middle">RandomForest</text>
  <text x="560" y="154" fill="#64748B" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle">NDBI · NDVI · veg · lat · lon</text>

  <!-- metrics.json (terminates) -->
  <rect x="816" y="56" width="224" height="120" rx="8" fill="#0B1120"/>
  <rect x="816" y="56" width="224" height="120" rx="8" fill="rgba(241,245,249,0.02)" stroke="rgba(255,255,255,0.10)" stroke-width="1" stroke-dasharray="4,3"/>
  <rect x="828" y="68" width="56" height="16" rx="2" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="0.8"/>
  <text x="856" y="79" fill="#64748B" font-size="9" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.10em">REPORT</text>
  <text x="928" y="112" fill="#94A3B8" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">metrics.json</text>
  <text x="928" y="134" fill="#94A3B8" font-size="11" font-family="'Fira Code', monospace" text-anchor="middle">R² 0.51 spatial-block</text>
  <text x="928" y="154" fill="#64748B" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle">0.90 random — the leaky one</text>

  <!-- Decision Support — FOCAL -->
  <rect x="448" y="368" width="224" height="120" rx="8" fill="#0B1120"/>
  <rect x="448" y="368" width="224" height="120" rx="8" fill="rgba(251,191,36,0.10)" stroke="#FBBF24" stroke-width="1.2"/>
  <rect x="460" y="380" width="48" height="16" rx="2" fill="none" stroke="rgba(251,191,36,0.45)" stroke-width="0.8"/>
  <text x="484" y="391" fill="#FBBF24" font-size="9" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.10em">RULES</text>
  <text x="560" y="424" fill="#F1F5F9" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Decision Support</text>
  <text x="560" y="446" fill="#94A3B8" font-size="11" font-family="'Fira Code', monospace" text-anchor="middle">land-cover gate · cost · rank</text>
  <text x="560" y="466" fill="#FBBF24" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle">8,144 → 4,157 eligible → 249</text>

  <!-- Dashboard -->
  <rect x="816" y="368" width="224" height="120" rx="8" fill="#0B1120"/>
  <rect x="816" y="368" width="224" height="120" rx="8" fill="#131C2E" stroke="rgba(255,255,255,0.16)" stroke-width="1"/>
  <rect x="828" y="380" width="32" height="16" rx="2" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.8"/>
  <text x="844" y="391" fill="#94A3B8" font-size="9" font-family="'Fira Code', monospace" text-anchor="middle" letter-spacing="0.10em">UI</text>
  <text x="928" y="424" fill="#F1F5F9" font-size="16" font-weight="600" font-family="'Fira Sans', sans-serif" text-anchor="middle">Dashboard</text>
  <text x="928" y="446" fill="#94A3B8" font-size="11" font-family="'Fira Code', monospace" text-anchor="middle">blended field · grid cells</text>
  <text x="928" y="466" fill="#34D399" font-size="10" font-family="'Fira Code', monospace" text-anchor="middle">every cell → Google Street View</text>

  <!-- ============ editorial annotation ============ -->
  <text x="1128" y="108" fill="#94A3B8" font-size="15" font-style="italic" font-family="Georgia, 'Times New Roman', serif">screening signal —</text>
  <text x="1128" y="132" fill="#94A3B8" font-size="15" font-style="italic" font-family="Georgia, 'Times New Roman', serif">not the decision path</text>

  <!-- ============ legend strip ============ -->
  <line x1="40" y1="512" x2="1400" y2="512" stroke="rgba(255,255,255,0.10)" stroke-width="0.8"/>
  <text x="40" y="540" fill="#64748B" font-size="10" font-family="'Fira Code', monospace" letter-spacing="0.14em">LEGEND</text>

  <line x1="132" y1="536" x2="172" y2="536" stroke="#94A3B8" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="184" y="540" fill="#94A3B8" font-size="11" font-family="'Fira Sans', sans-serif">The decision path</text>

  <line x1="368" y1="536" x2="408" y2="536" stroke="#64748B" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-soft)"/>
  <text x="420" y="540" fill="#94A3B8" font-size="11" font-family="'Fira Sans', sans-serif">Diagnostic — reported, not consumed</text>

  <rect x="760" y="528" width="16" height="16" rx="3" fill="rgba(251,191,36,0.10)" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="788" y="540" fill="#94A3B8" font-size="11" font-family="'Fira Sans', sans-serif">Auditable rule + cost engine — every recommendation traceable to a rule and a rate</text>
</svg>
